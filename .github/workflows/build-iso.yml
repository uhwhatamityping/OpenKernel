name: Build OpenTails ISO

on:
  workflow_dispatch:
  push:
    paths:
      - "terminal.py"
      - ".github/workflows/build-iso.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout OpenTails
        uses: actions/checkout@v4

      - name: Install basic tools
        run: |
          sudo apt update
          sudo apt install -y \
            wget \
            curl \
            xorriso \
            squashfs-tools \
            debootstrap \
            debian-archive-keyring \
            dpkg-dev

      - name: Install Debian Trixie live-build
        run: |
          mkdir -p /tmp/live-build

          cd /tmp/live-build

          wget http://deb.debian.org/debian/pool/main/l/live-build/live-build_20250505+deb13u1_all.deb

          sudo dpkg -i live-build_20250505+deb13u1_all.deb || true

          sudo apt-get install -f -y

      - name: Verify live-build
        run: |
          which lb
          lb --version

      - name: Clean previous build
        run: |
          sudo lb clean --purge || true

          sudo rm -rf \
            cache \
            chroot \
            binary \
            config \
            .build

      - name: Configure Debian Live
        run: |
          lb config \
            --distribution trixie \
            --architectures amd64 \
            --binary-images iso-hybrid \
            --linux-packages linux-image \
            --linux-flavours amd64 \
            --mirror-bootstrap http://deb.debian.org/debian \
            --mirror-chroot http://deb.debian.org/debian \
            --mirror-binary http://deb.debian.org/debian \
            --mirror-chroot-security http://security.debian.org/debian-security \
            --mirror-binary-security http://security.debian.org/debian-security \
            --bootappend-live "boot=live"

      - name: Configure Debian repositories
        run: |
          mkdir -p config/archives

          cat > config/archives/debian.list.chroot <<'EOF'
          deb http://deb.debian.org/debian trixie main
          deb http://deb.debian.org/debian trixie-updates main
          deb http://security.debian.org/debian-security trixie-security main
          EOF

          cat > config/archives/debian.list.binary <<'EOF'
          deb http://deb.debian.org/debian trixie main
          deb http://deb.debian.org/debian trixie-updates main
          deb http://security.debian.org/debian-security trixie-security main
          EOF

      - name: Add Debian Live packages
        run: |
          mkdir -p config/package-lists

          cat > config/package-lists/live.list.chroot <<'EOF'
          live-boot
          live-config
          live-config-systemd
          EOF

      - name: Add OpenTails packages
        run: |
          cat > config/package-lists/opentails.list.chroot <<'EOF'
          python3
          python3-pip
          python3-venv
          systemd
          sudo
          curl
          wget
          nano
          bash
          coreutils
          procps
          iproute2
          iputils-ping
          EOF

      - name: Add OpenTails terminal
        run: |
          mkdir -p config/includes.chroot/opt/opentails

          cp terminal.py \
            config/includes.chroot/opt/opentails/terminal.py

          chmod +x \
            config/includes.chroot/opt/opentails/terminal.py

      - name: Create OpenTails service
        run: |
          mkdir -p \
            config/includes.chroot/etc/systemd/system/multi-user.target.wants

          cat > config/includes.chroot/etc/systemd/system/opentails.service <<'EOF'
          [Unit]
          Description=OpenTails Terminal
          After=systemd-user-sessions.service getty-pre.target
          Conflicts=getty@tty1.service

          [Service]
          Type=simple

          ExecStart=/usr/bin/python3 /opt/opentails/terminal.py

          Restart=on-failure
          RestartSec=1

          StandardInput=tty
          StandardOutput=tty
          StandardError=tty

          TTYPath=/dev/tty1
          TTYReset=yes
          TTYVHangup=yes
          TTYVTDisallocate=yes

          [Install]
          WantedBy=multi-user.target
          EOF

          ln -sf \
            /etc/systemd/system/opentails.service \
            config/includes.chroot/etc/systemd/system/multi-user.target.wants/opentails.service

      - name: Disable tty1 getty
        run: |
          mkdir -p \
            config/includes.chroot/etc/systemd/system/getty@tty1.service.d

          cat > config/includes.chroot/etc/systemd/system/getty@tty1.service.d/opentails.conf <<'EOF'
          [Unit]
          ConditionPathExists=/nonexistent
          EOF

      - name: Build OpenTails ISO
        run: |
          sudo lb build

      - name: Verify ISO
        run: |
          ls -lh live-image-amd64.hybrid.iso
          file live-image-amd64.hybrid.iso

      - name: Upload OpenTails ISO
        uses: actions/upload-artifact@v4
        with:
          name: OpenTails-x86_64
          path: live-image-amd64.hybrid.iso
          if-no-files-found: error
